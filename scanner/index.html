<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan a Product Barcode | PickMyProtein</title>
<meta name="description" content="Scan any packaged food or protein supplement barcode to check nutrition, ingredient red flags, and an instant label transparency score.">
<link rel="canonical" href="https://pickmyprotein.com/scanner/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#16231f;--sub:#52645e;--line:#d9e2de;--btn:#0e5a4a;--btn-ink:#fff;--good:#1e7a46;--ok:#a86a0f;--poor:#b3261e;--tint:#e8efec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#17221e;--ink:#e8f0ec;--sub:#9db0a9;--line:#2b3b35;--btn:#4fc3a1;--btn-ink:#08241c;--good:#5fd08d;--ok:#e3a94a;--poor:#ff8b82;--tint:#1f2d28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
header{border-bottom:1px solid var(--line);background:var(--card)}
.nav{max-width:480px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
.nav-links{display:flex;gap:14px;font-size:14px}
.nav-links a{color:var(--sub);text-decoration:none;font-weight:700}
.nav-links a:hover{color:var(--ink)}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 16px}
button{font:inherit;cursor:pointer}
.scan{width:100%;padding:16px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-size:18px;font-weight:700}
.scan:focus-visible,input:focus-visible,.chip:focus-visible,.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cam{display:none;margin-top:12px;position:relative}
.cam video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}
.cam .guide{position:absolute;inset:30% 12%;border:3px solid #fff;border-radius:8px;pointer-events:none}
.cam button{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.manual{display:flex;gap:8px;margin-top:16px}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.go{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--tint);color:var(--ink);font-size:14px}
.msg{margin:12px 0 0;color:var(--sub);font-size:14px;min-height:1.4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}
.top{display:flex;gap:14px;align-items:center}
.score{flex:none;width:76px;height:76px;border-radius:50%;border:6px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.good{color:var(--good)}.ok{color:var(--ok)}.poor{color:var(--poor)}
.name{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.grade{margin:0;font-weight:700}
.brand{margin:0;color:var(--sub);font-size:14px}
h2{font-size:16px;margin:20px 0 8px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.neg{color:var(--poor)}.pos{color:var(--good)}
.ing{font-size:14px;color:var(--sub);margin:0}
.cta-box{margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--tint);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.cta-box p{margin:0;font-size:14px}
.cta{flex:none;padding:8px 12px;border-radius:8px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-size:14px;font-weight:700}
.note{font-size:13px;color:var(--sub);margin:16px 0 0}
footer{max-width:480px;margin:0 auto;padding:0 16px 32px;font-size:13px;color:var(--sub);text-align:center}
footer a{color:var(--sub)}
</style>
</head>
<body>
<header>
  <nav class="nav" aria-label="Primary">
    <a class="logo" href="/">PickMyProtein</a>
    <div class="nav-links">
      <a href="/">Protein Check</a>
      <a href="/calculators/">Calculators</a>
    </div>
  </nav>
</header>

<main>
<h1>Scan a product</h1>
<p class="lead">Point your camera at the barcode on any packed food or supplement to see its score and why.</p>

<button class="scan" id="scanBtn">Scan barcode</button>
<div class="cam" id="cam">
<video id="video" playsinline muted></video>
<div class="guide"></div>
<button id="stopBtn" type="button">Stop camera</button>
</div>

<form class="manual" id="manual">
<input id="code" inputmode="numeric" pattern="[0-9]*" placeholder="Or type the barcode number" aria-label="Barcode number">
<button class="go" type="submit">Check</button>
</form>
<div class="chips" id="chips"></div>
<p class="msg" id="msg" role="status"></p>

<div id="out"></div>
</main>

<footer>
  <a href="/">Home</a> &middot; <a href="/calculators/">Calculators</a>
</footer>

<script>
const SAMPLES={
"8900000000011":{name:"Choco Crunch cereal (sample)",brand:"Sample brand",ingredients:"Refined wheat flour, sugar, cocoa powder, glucose syrup, palm oil, maltodextrin, salt, colour (INS 150d), emulsifier (INS 322)",per100:{sugar:28,sat:2,sodium:350,fiber:2,protein:7}},
"8900000000028":{name:"Plain rolled oats (sample)",brand:"Sample brand",ingredients:"Rolled oats",per100:{sugar:1,sat:1.4,sodium:5,fiber:10,protein:13}},
"8900000000035":{name:"Chocolate whey protein (sample)",brand:"Sample brand",ingredients:"Whey protein concentrate, cocoa powder, sucralose, acesulfame potassium, soy lecithin, xanthan gum, flavour",per100:{sugar:4,sat:3,sodium:420,fiber:2,protein:72}},
"8900000000042":{name:"Cream biscuits (sample)",brand:"Sample brand",ingredients:"Refined wheat flour, sugar, palm oil, invert syrup, milk solids, raising agents (INS 500), artificial flavour, colour (INS 102)",per100:{sugar:32,sat:12,sodium:310,fiber:1,protein:5}},
"8900000000059":{name:"Unsweetened muesli (sample)",brand:"Sample brand",ingredients:"Oats, almonds, sunflower seeds, raisins, wheat flakes",per100:{sugar:9,sat:1.8,sodium:30,fiber:8,protein:11}}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const band=(v,steps)=>{for(const [l,p] of steps)if(v<=l)return p;return 0};
const atLeast=(v,steps)=>{for(const [l,p] of steps)if(v>=l)return p;return 0};

function scoreProduct(p){
 const n=p.per100;
 const nut=[
  ["Sugar",n.sugar+"g",band(n.sugar,[[2,20],[5,16],[10,11],[15,6]]),20],
  ["Saturated fat",n.sat+"g",band(n.sat,[[1,10],[3,7],[5,4]]),10],
  ["Sodium",Math.round(n.sodium)+"mg",band(n.sodium,[[120,10],[400,7],[700,3]]),10],
  ["Fibre",n.fiber+"g",atLeast(n.fiber,[[6,10],[3,6],[1.5,3]]),10],
  ["Protein",n.protein+"g",atLeast(n.protein,[[15,10],[8,6],[4,3]]),10]
 ];
 let nutTotal=0;nut.forEach(r=>nutTotal+=r[2]);
 const ing=(p.ingredients||"").toLowerCase();
 const parts=ing.split(",").map(s=>s.trim()).filter(Boolean);
 const ded=[];
 const count=(re)=>{const m=ing.match(new RegExp(re.source,"g"));return m?new Set(m).size:0};
 const sweet=count(/aspartame|sucralose|acesulfame|saccharin|ins ?95\d/);
 if(sweet)ded.push(["Artificial sweetener"+(sweet>1?"s ("+sweet+")":""),-Math.min(10,5*sweet)]);
 const col=count(/tartrazine|sunset yellow|carmoisine|brilliant blue|ins ?1[0-9]{2}[a-z]?|artificial colou?r/);
 if(col)ded.push(["Added colour"+(col>1?"s ("+col+")":""),-Math.min(10,5*col)]);
 const trans=/hydrogenated|trans fat|vanaspati|margarine/.test(ing);
 if(trans)ded.push(["Hydrogenated fat or trans fat",-10]);
 if(/palm/.test(ing))ded.push(["Palm oil",-3]);
 if(parts.length&&/refined (wheat )?flour|maida/.test(parts[0]))ded.push(["Refined flour is the first ingredient",-5]);
 const sugars=count(/sugar|maltodextrin|dextrose|glucose|invert|fructose|syrup/);
 if(sugars)ded.push(["Added sugar in "+sugars+" form"+(sugars>1?"s":""),-Math.min(8,2*sugars)]);
 const pres=count(/sodium benzoate|potassium sorbate|propionate|ins ?2[0-9]{2}/);
 if(pres)ded.push(["Preservative"+(pres>1?"s ("+pres+")":""),-Math.min(6,2*pres)]);
 if(parts.length>15)ded.push(["Very long ingredient list",-3]);
 let ingTotal=30;ded.forEach(d=>ingTotal+=d[1]);ingTotal=Math.max(0,ingTotal);
 let score=Math.round((nutTotal+ingTotal)/90*100);
 if(trans)score=Math.min(score,59);
 return{score,nut,ded,nutTotal,ingTotal};
}
const grade=s=>s>=80?["Excellent","good"]:s>=60?["Good","good"]:s>=40?["Mediocre","ok"]:["Poor","poor"];

function render(p,code){
 const r=scoreProduct(p),[g,cls]=grade(r.score);
 const nutRows=r.nut.map(x=>`<tr><td>${x[0]} ${esc(x[1])} per 100g</td><td class="${x[2]>=x[3]*0.6?"pos":"neg"}">${x[2]} of ${x[3]}</td></tr>`).join("");
 const dedRows=r.ded.length?r.ded.map(d=>`<tr><td>${esc(d[0])}</td><td class="neg">${d[1]}</td></tr>`).join(""):`<tr><td>No flagged ingredients</td><td class="pos">30 of 30</td></tr>`;
 const isProtein=/whey|casein|protein|isolate|concentrate/i.test((p.name||"")+" "+(p.ingredients||""))||p.per100.protein>=20;
 const cta=isProtein?`<div class="cta-box"><p>Looking for a cleaner protein supplement?</p><a class="cta" href="/">Take 60s Check</a></div>`:"";
 $("out").innerHTML=`<section class="card" aria-live="polite">
 <div class="top"><div class="score ${cls}" aria-label="Score ${r.score} out of 100">${r.score}</div>
 <div><p class="name">${esc(p.name)}</p><p class="grade ${cls}">${g}, ${r.score} out of 100</p><p class="brand">${esc(p.brand||"")} ${esc(code)}</p></div></div>
 <h2>Nutrition</h2><table>${nutRows}</table>
 <h2>Ingredients</h2><table>${dedRows}</table>
 <h2>Ingredient list</h2><p class="ing">${esc(p.ingredients||"Not available")}</p>
 ${cta}
 <p class="note">Score is based on label data only, using our published method v1.0. Source: ${esc(p.source||"Sample data")}. This is general information, not medical advice.</p>
 </section>`;
 $("out").scrollIntoView({behavior:"smooth",block:"start"});
}

async function getProduct(code){
 try{
  const res=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,brands,ingredients_text,nutriments");
  const j=await res.json();
  if(j.status===1&&j.product){
   const p=j.product,n=p.nutriments||{};
   if(n.sugars_100g!=null||n.proteins_100g!=null||n.fat_100g!=null){
    const sodiumMg=n.sodium_100g!=null?(+n.sodium_100g)*1000:(n.salt_100g!=null?(+n.salt_100g)*400:0);
    return{name:p.product_name||"Unnamed product",brand:p.brands||"",ingredients:p.ingredients_text||"",source:"Open Food Facts",
     per100:{sugar:+(n.sugars_100g||0),sat:+(n["saturated-fat_100g"]||0),sodium:sodiumMg,fiber:+(n.fiber_100g||0),protein:+(n.proteins_100g||0)}};
   }
  }
 }catch(e){}
 return SAMPLES[code]||null;
}

async function lookup(raw){
 const code=String(raw).replace(/\D/g,"");
 if(!code){$("msg").textContent="Enter the digits printed under the barcode.";return}
 $("msg").textContent="Looking up "+code+"…";
 const p=await getProduct(code);
 if(!p){$("out").innerHTML="";$("msg").textContent="We don't have that product yet. Try another barcode or one of the samples above.";return}
 $("msg").textContent="";
 render(p,code);
}

let stream=null,scanning=false;
function stopCam(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("cam").style.display="none"}
async function startCam(){
 if(!("BarcodeDetector" in window)){$("msg").textContent="Camera scanning isn't supported in this browser. Type the barcode number below.";return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}
 catch(e){$("msg").textContent="Camera access was blocked. Allow it in your browser settings or type the barcode.";return}
 const v=$("video");v.srcObject=stream;await v.play();$("cam").style.display="block";$("msg").textContent="Hold the barcode inside the box.";
 scanning=true;
 const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
 const tick=async()=>{
  if(!scanning)return;
  try{const c=await det.detect(v);if(c.length){stopCam();lookup(c[0].rawValue);return}}catch(e){}
  requestAnimationFrame(tick);
 };
 tick();
}

$("scanBtn").addEventListener("click",startCam);
$("stopBtn").addEventListener("click",()=>{stopCam();$("msg").textContent=""});
$("manual").addEventListener("submit",e=>{e.preventDefault();lookup($("code").value)});
$("chips").innerHTML='<span class="msg" style="margin:0;width:100%">Try a sample product:</span>'+Object.keys(SAMPLES).map(k=>`<button class="chip" type="button" data-c="${k}">${esc(SAMPLES[k].name.replace(" (sample)",""))}</button>`).join("");
$("chips").addEventListener("click",e=>{const c=e.target.dataset&&e.target.dataset.c;if(c){$("code").value=c;lookup(c)}});
</script>
</body>
</html>
