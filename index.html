<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick My Protein - Daily Calculator & Product Matcher</title>
    <style>
        :root {
            --primary-orange: #f97316;
            --primary-orange-dark: #ea580c;
            --orange-soft: #fff7ed;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(30, 41, 59, 0.85) 100%), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* HERO HEADER */
        .hero {
            background: linear-gradient(135deg, rgba(255, 247, 237, 0.96) 0%, rgba(255, 237, 213, 0.96) 100%);
            border-bottom: 2px solid #fed7aa;
            text-align: center;
            padding: 35px 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .logo-badge {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            font-weight: 900;
            font-size: 1.6rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
        }
        .brand-title {
            font-size: 2.1rem;
            font-weight: 800;
            color: #9a3412;
        }
        .hero p {
            color: #c2410c;
            font-size: 0.95rem;
            font-weight: 600;
            max-width: 500px;
            margin: 0 auto;
        }

        /* APP CONTAINER */
        .app-container {
            max-width: 620px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }
        .card {
            background: var(--card-bg);
            padding: 32px 26px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 2.5px solid #fb923c;
        }

        /* PROGRESS TRACKER */
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #fed7aa;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary-orange);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* FACTS GRID */
        .facts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0 24px 0;
        }
        .fact-card {
            background: var(--orange-soft);
            border: 1.5px solid #fed7aa;
            padding: 14px 10px;
            border-radius: 14px;
            text-align: center;
        }
        .fact-card .icon { font-size: 1.4rem; margin-bottom: 4px; display: block; }
        .fact-card .title { font-size: 0.8rem; font-weight: 800; color: #9a3412; text-transform: uppercase; }
        .fact-card .desc { font-size: 0.75rem; color: #c2410c; margin-top: 2px; }

        /* FORM ELEMENTS */
        .form-group { margin-bottom: 22px; text-align: left; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #9a3412; font-size: 0.95rem; }
        
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2.5px solid #fb923c;
            border-radius: 12px;
            font-size: 1rem;
            background-color: #fffaf5;
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.25s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ea580c;
            background-color: #ffffff;
            box-shadow: 0 0 0 5px rgba(249, 115, 22, 0.25);
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange-dark) 100%);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1.05rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(249, 115, 22, 0.45);
        }

        /* RESULTS & PRODUCTS */
        .results-box {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 2px solid #fb923c;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 28px;
            text-align: center;
        }
        .results-box h2 { color: #9a3412; font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; }
        .results-box p { color: #c2410c; font-size: 0.95rem; font-weight: 600; }

            padding: 22px;
            border-radius: 16px;
            margin-bottom: 18px;
