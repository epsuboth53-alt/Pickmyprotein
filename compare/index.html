<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Protein Powders in India | Pick My Protein</title>
<style>
:root{--p:#f36c21;--bg:#0f172a;--card:#1e293b;--b:#334155}
body{font-family:system-ui,sans-serif;background:var(--bg);color:#fff;margin:0;line-height:1.5}
header{padding:1rem 2rem;display:flex;justify-content:space-between;border-bottom:1px solid var(--b)}
nav a{color:#cbd5e1;text-decoration:none;margin-left:1.5rem}
.wrap{max-width:960px;margin:2rem auto;padding:0 1rem}
.box{background:var(--card);padding:1.5rem;border-radius:12px;border:1px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.slot{background:var(--bg);padding:1rem;border-radius:8px;border:1px solid var(--b)}
label{display:block;font-size:.82rem;color:#cbd5e1;margin:.5rem 0 .2rem}
select,input{width:100%;padding:.6rem;border-radius:6px;border:1px solid var(--b);background:var(--card);color:#fff;box-sizing:border-box}
.cbox{display:none;margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--b)}
.row{display:flex;gap:.4rem;margin-top:.4rem}
.sbtn{background:#334155;color:#fff;border:1px solid #475569;padding:.4rem;border-radius:5px;font-size:.78rem;cursor:pointer;flex:1}
.btn{background:var(--p);color:#fff;border:none;padding:.9rem;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:1.2rem;width:100%}
.twrap{overflow-x:auto;margin-top:1.5rem}
table{width:100%;border-collapse:collapse;background:var(--bg)}
th,td{padding:.8rem;border:1px solid var(--b);text-align:left;font-size:.9rem}
th{background:#0b1120;color:#cbd5e1;width:22%}
.win{background:rgba(52,211,153,.15);color:#34d399;padding:.15rem .45rem;border-radius:4px;font-size:.72rem;font-weight:700}
.buy{display:inline-block;background:var(--p);color:#fff;padding:.4rem .8rem;border-radius:5px;text-decoration:none;font-size:.82rem;font-weight:600}
</style>
</head>
<body>
<header>
<a href="/" style="color:#fff;font-weight:700;text-decoration:none">pickmyprotein.com</a>
<nav><a href="/calculators/">Calculators</a><a href="/compare/" style="color:#f36c21">Compare</a><a href="/best-protein/">Best Guides</a></nav>
</header>

<div class="wrap">
<h1>Build Your Custom Protein Comparison</h1>
<div class="box">
<div class="grid" id="slots"></div>
<button type="button" class="btn" onclick="renderTable()">⚡ Compare Selected Proteins Side-by-Side</button>
<div class="twrap"><table id="tbl"></table></div>
</div>
</div>

<script>
const TAG="pickmyprote03-21";
const DB={
mb_enz:{n:"MuscleBlaze Raw Whey + Enzymes (1kg)",t:"Whey Concentrate",m:2099,s:33,p:24,h:"Digestive Enzymes • Zero Bloating",u:"https://www.amazon.in/MuscleBlaze-Protein-Concentrate-Unflavoured-Digestive/dp/B0BPH457FG?tag="+TAG},
mb_raw:{n:"MuscleBlaze Clean Raw Whey (1kg)",t:"Raw Whey Concentrate",m:4799,s:33,p:24,h:"Lab-Tested Purity • Unflavoured",u:"https://www.amazon.in/MuscleBlaze-Raw-Whey-Protein-Unflavoured/dp/B06XGNT22C?tag="+TAG},
mb_pr:{n:"MuscleBlaze Biozyme Whey PR (1kg)",t:"Whey + 3g Creatine",m:3999,s:25,p:30,h:"30g Protein + 3g Creatine",u:"https://www.amazon.in/gp/aw/d/B0D6R1GKH3?tag="+TAG},
as_raw:{n:"AS-IT-IS Raw Whey 80% (1kg)",t:"Raw Whey Concentrate",m:4190,s:33,p:24,h:"Labdoor Certified • Single Ingredient",u:"https://www.amazon.in/AS-Nutrition-Protein-Concentrate-Unflavoured/dp/B079SZJJDR?tag="+TAG},
as_one:{n:"AS-IT-IS ONE Whey (780g)",t:"Raw Whey Concentrate",m:3299,s:22,p:28,h:"Trustified & Labdoor Tested",u:"https://www.amazon.in/Whey-Protein-Concentrate-Sunday-Workout/dp/B09HKFSSPY?tag="+TAG},
as_atom:{n:"AS-IT-IS ATOM Whey Chocolate (1kg)",t:"Flavoured Concentrate",m:3499,s:28,p:27,h:"27g Protein + Enzymes",u:"https://www.amazon.in/Nutrition-Concentrate-Chocolate-Certified-absorption/dp/B09DKFPQ91?tag="+TAG},
nk_gold:{n:"Nakpro Gold Whey Concentrate (1kg)",t:"Whey Concentrate",m:4600,s:26,p:28,h:"Trustified Certified • 28g/serve",u:"https://www.amazon.in/NAKPRO-GOLD-Protein-Concentrate-Unflavored/dp/B07M7YZ57R?tag="+TAG},
nk_iso:{n:"Nakpro Platinum Whey Isolate (1kg)",t:"100% Whey Isolate",m:7000,s:30,p:28,h:"Affordable Pure Whey Isolate",u:"https://www.amazon.in/s?k=Nakpro+Platinum+Whey+Isolate+1kg&tag="+TAG},
avvatar:{n:"Avvatar Whey Protein (1kg)",t:"Fresh Cow Milk Whey",m:5849,s:29,p:27,h:"100% Fresh Indian Cow Milk",u:"https://www.amazon.in/gp/aw/d/B09CKM57HL?tag="+TAG},
twt:{n:"The Whole Truth Unflavoured Whey (1kg)",t:"Clean Whey Concentrate",m:4499,s:33,p:24,h:"Zero Gums or Artificial Flavours",u:"https://www.amazon.in/s?k=The+Whole+Truth+Whey+1kg&tag="+TAG},
wb:{n:"Wellbeing Nutrition Raw Whey + Probiotics",t:"Whey + 4B Probiotics",m:4999,s:28,p:27,h:"4B CFU Probiotics • Grass-Fed",u:"https://www.amazon.in/Wellbeing-Nutrition-Concentrate-Unflavoured-Probiotics/dp/B0DMNWWH5S?tag="+TAG},
yb:{n:"Yogabar Pro Clean Whey (1kg)",t:"Whey Concentrate",m:2999,s:28,p:25,h:"Pro-Absorb • Zero Additives",u:"https://www.amazon.in/Yogabar-Concentrate-Unflavoured-Clinically-Pro-Absorb/dp/B0DV5D8355?tag="+TAG},
dz_raw:{n:"Denzour Denz-Raw Whey 80% (1kg)",t:"Imported Raw Whey",m:3199,s:30,p:27,h:"Budget Raw 80% • 5.9g BCAA",u:"https://www.amazon.in/DENZOUR-NUTRITION-Denz-Raw-Digesting-Unflavoured/dp/B0C9JWXLH4?tag="+TAG},
dz_lean:{n:"Denzour Denz-Lean Whey (1kg)",t:"Lean Gaining Blend",m:3499,s:28,p:22,h:"Clinically Tested Formula",u:"https://www.amazon.in/DENZOUR-NUTRITION-Clinically-Performance-Unforgettable/dp/B0CD2LHFNT?tag="+TAG},
on_gold:{n:"ON Gold Standard 100% Whey (907g)",t:"Isolate Primary Blend",m:6319,s:29,p:24,h:"Global Benchmark • Informed Choice",u:"https://www.amazon.in/Nutrition-Standard-Alphonso-Recovery-Vegetarian/dp/B0D1VJ3C7R?tag="+TAG},
isopure:{n:"Isopure Zero Carb Isolate (1kg)",t:"100% Whey Isolate",m:10399,s:32,p:25,h:"Zero Carbs • Lactose-Free",u:"https://www.amazon.in/Isopure-Unflavored-Protein-Powder-Lactose-free/dp/B0D17K39TW?tag="+TAG},
cosmix:{n:"Cosmix No-Nonsense Plant Protein (1kg)",t:"Pea & Rice Isolate",m:2492,s:28,p:24,h:"Zero Gums • Gut-Friendly Vegan",u:"https://www.amazon.in/No-Nonsense-Protein-Indonesian-Isolate-Essential/dp/B0DM1X4FLG?tag="+TAG},
tb_plant:{n:"TrueBasics Clean Plant Protein (1kg)",t:"Rice & Pea Protein",m:2999,s:28,p:24,h:"Heavy Metal & Pesticide Tested",u:"https://www.amazon.in/TrueBasics-Clean-Protein-Powder-Chocolate/dp/B0FMRVH8QB?tag="+TAG},
oziva:{n:"OZiva Organic Plant Protein (1kg)",t:"Pea, Rice & Quinoa",m:2499,s:27,p:30,h:"30g Plant Protein • Zero Sugar",u:"https://www.amazon.in/OZiva-Organic-Protein-Unflavored-Isolate/dp/B09VGSVRXH?tag="+TAG},
origin:{n:"Origin Nutrition Plant Protein (1kg)",t:"Pea & Pumpkin Seed",m:2499,s:30,p:25,h:"Informed Choice • Smooth Texture",u:"https://www.amazon.in/Origin-Nutrition-Natural-Protein-Unflavoured/dp/B08X1T9THR?tag="+TAG},
nb_pea:{n:"Nutrabay Gold Pea Protein (1kg)",t:"Hydrolyzed Pea Isolate",m:1799,s:28,p:25,h:"Trustified • Budget Vegan",u:"https://www.amazon.in/NUTRABAY-Gold-100-Protein-Powder/dp/B0G44ZRYRX?tag="+TAG},
tata_egg:{n:"Tata 1mg Egg White Protein (1kg)",t:"Dairy-Free Egg Albumin",m:2995,s:30,p:24,h:"Zero Lactose • High Bioavailability",u:"https://www.amazon.in/White-Protein-Powder-BCAAs-Chocolate/dp/B0HFKFJ637?tag="+TAG},
as_soy:{n:"AS-IT-IS Soy Protein Isolate (1kg)",t:"90% Soy Isolate",m:1285,s:30,p:30,h:"Lowest Cost/Gram • 30g/scoop",u:"https://www.amazon.in/Nutrition-Protein-Isolate-Supplementation-Vegan/dp/B07ZM7CW2Z?tag="+TAG},
pn_soy:{n:"Pure Nutrition Soy Isolate (1kg)",t:"Non-GMO Soy Isolate",m:1999,s:33,p:27,h:"Non-GMO • Zero Sugar",u:"https://www.amazon.in/Pure-Nutrition-Protein-Isolate-Powder/dp/B0DKTNQRWH?tag="+TAG}
};

function init(){
const defs=["mb_enz","as_raw","none"];
let out="";
for(let i=1;i<=3;i++){
let opts=i===3?'<option value="none" selected>-- None (Compare 2) --</option>':'';
for(const k in DB) opts+=`<option value="${k}" ${defs[i-1]===k?'selected':''}>${DB[k].n}</option>`;
opts+='<option value="custom">+ Add Custom Product (Fetch Online)</option>';
out+=`<div class="slot"><strong style="color:${i<3?'#f36c21':'#94a3b8'}">Product ${i}${i===3?' (Optional)':''}</strong>
<label>Choose Protein</label><select id="s${i}" onchange="onSel(${i})">${opts}</select>
<div id="c${i}" class="cbox">
<label>Brand / Name</label><input id="n${i}" placeholder="e.g., MyProtein Whey">
<div class="row"><button type="button" class="sbtn" onclick="fetchNet(${i})">🌐 Fetch</button><button type="button" class="sbtn" onclick="window.open('https://www.amazon.in/s?k='+encodeURIComponent(document.getElementById('n${i}').value||'whey protein')+'&tag=${TAG}')">🛒 Amazon</button></div>
<div id="st${i}" style="font-size:.75rem;color:#34d399;margin-top:.3rem"></div>
<label>Amazon MRP (₹)</label><input type="number" id="m${i}" value="2500" oninput="renderTable()">
<label>Scoops</label><input type="number" id="sc${i}" value="30" oninput="renderTable()">
<label>Protein/Scoop (g)</label><input type="number" id="p${i}" value="24" oninput="renderTable()">
</div></div>`;
}
document.getElementById("slots").innerHTML=out;
renderTable();
}

function onSel(i){
document.getElementById("c"+i).style.display=document.getElementById("s"+i).value==="custom"?"block":"none";
renderTable();
}

async function fetchNet(i){
const q=document.getElementById("n"+i).value.trim();
const st=document.getElementById("st"+i);
if(!q)return alert("Enter product name first");
st.textContent="Searching...";
try{
const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=3");
const d=await r.json();
const hit=(d.products||[]).find(x=>x.nutriments&&x.nutriments.proteins_100g);
if(hit){
const g=Math.round((hit.nutriments.proteins_100g/100)*32);
document.getElementById("p"+i).value=g;
st.textContent="✓ Found (~"+g+"g/scoop)";
renderTable();return;
}
st.textContent="Not found—enter grams manually";
}catch(e){st.textContent="Lookup failed—enter manually";}
}

function renderTable(){
const list=[];
for(let i=1;i<=3;i++){
const v=document.getElementById("s"+i).value;
if(v==="none")continue;
if(v==="custom"){
const m=+document.getElementById("m"+i).value||0,sc=+document.getElementById("sc"+i).value||0,p=+document.getElementById("p"+i).value||0;
if(m>0&&sc>0&&p>0){const nm=document.getElementById("n"+i).value.trim()||"Custom "+i;list.push({n:nm,t:"Custom Entry",m,s:sc,p,tot:sc*p,cpg:m/(sc*p),h:"Custom label",u:"https://www.amazon.in/s?k="+encodeURIComponent(nm)+"&tag="+TAG});}
}else if(DB[v]){const x=DB[v];list.push({...x,tot:x.s*x.p,cpg:x.m/(x.s*x.p)});}
}
if(list.length<2)return;
const min=Math.min(...list.map(x=>x.cpg));
let r1="<tr><th>Product</th>",r2="<tr><th>Type</th>",r3="<tr><th>Amazon MRP</th>",r4="<tr><th>Protein / Scoop</th>",r5="<tr><th>Total Protein</th>",r6="<tr><th>Cost / Gram (MRP)</th>",r7="<tr><th>Highlight</th>",r8="<tr><th>Buy</th>";
list.forEach(x=>{
const w=Math.abs(x.cpg-min)<0.01;
r1+=`<td>${w?'<span class="win">BEST VALUE</span><br>':''}<strong>${x.n}</strong></td>`;
r2+=`<td>${x.t}</td>`;
r3+=`<td>₹${x.m.toLocaleString('en-IN')}</td>`;
r4+=`<td><strong>${x.p}g</strong> (${x.s} scoops)</td>`;
r5+=`<td>${x.tot}g</td>`;
r6+=`<td style="color:${w?'#34d399':'#fff'};font-weight:700">₹${x.cpg.toFixed(2)} / g</td>`;
r7+=`<td style="color:#94a3b8;font-size:.82rem">${x.h}</td>`;
r8+=`<td><a href="${x.u}" target="_blank" rel="nofollow sponsored" class="buy">Check Amazon &rarr;</a></td>`;
});
document.getElementById("tbl").innerHTML=r1+"</tr>"+r2+"</tr>"+r3+"</tr>"+r4+"</tr>"+r5+"</tr>"+r6+"</tr>"+r7+"</tr>"+r8+"</tr>";
}
init();
</script>
</body>
</html>
