let netHits={1:[],2:[],3:[]};

function init(){
const defs=["mb_enz","as_raw","none"];
let out="";
for(let i=1;i<=3;i++){
let opts=i===3?'<option value="none" selected>-- None (Compare 2) --</option>':'';
opts+='<option value="custom">🌐 Search Any Brand Online (Internet Lookup)</option>';
for(const k in DB) opts+=`<option value="${k}" ${defs[i-1]===k?'selected':''}>${DB[k].n}</option>`;
out+=`<div class="slot"><strong style="color:${i<3?'#f36c21':'#94a3b8'}">Product ${i}${i===3?' (Optional)':''}</strong>
<label>Select from 42 Brands or Search Web</label><select id="s${i}" onchange="onSel(${i})">${opts}</select>
<div id="c${i}" class="cbox">
<label>Type Any Brand / Product Name</label><input id="n${i}" placeholder="e.g., BeastLife Whey, MyProtein, GNC">
<div class="row"><button type="button" class="sbtn" onclick="fetchNet(${i})">🌐 Search Internet</button><button type="button" class="sbtn" onclick="window.open('https://www.amazon.in/s?k='+encodeURIComponent(document.getElementById('n${i}').value||'whey protein 1kg')+'&tag=${TAG}')">🛒 Check Amazon</button></div>
<div id="st${i}" style="font-size:.75rem;color:#34d399;margin-top:.3rem"></div>
<select id="res${i}" style="display:none;margin-top:.35rem" onchange="pickHit(${i})"></select>
<label>Amazon MRP (₹)</label><input type="number" id="m${i}" value="2999" oninput="renderTable()">
<label>Total Scoops in Pack</label><input type="number" id="sc${i}" value="30" oninput="renderTable()">
<label>Protein Per Scoop (g)</label><input type="number" id="p${i}" value="24" oninput="renderTable()">
</div></div>`;
}
document.getElementById("slots").innerHTML=out;
renderTable();
}

function onSel(i){
document.getElementById("c"+i).style.display=document.getElementById("s"+i).value==="custom"?"block":"none";
renderTable();
}

async function fetchNet(i){
const q=document.getElementById("n"+i).value.trim();
const st=document.getElementById("st"+i),sel=document.getElementById("res"+i);
if(!q)return alert("Type a brand or product name first");
st.style.color="#94a3b8";st.textContent="Searching global & India food database...";sel.style.display="none";
try{
const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=8");
const d=await r.json();
netHits[i]=(d.products||[]).filter(x=>x.product_name&&x.nutriments&&x.nutriments.proteins_100g);
if(netHits[i].length){
sel.innerHTML=netHits[i].map((x,idx)=>`<option value="${idx}">${x.product_name} (${Math.round(x.nutriments.proteins_100g)}g/100g)</option>`).join("");
sel.style.display="block";pickHit(i);
st.style.color="#34d399";st.textContent="✓ Found "+netHits[i].length+" matches—select version above & enter Amazon MRP:";
return;
}
st.style.color="#f36c21";st.textContent="Not in open database—click Check Amazon & enter label grams below.";
}catch(e){st.style.color="#f36c21";st.textContent="Search unavailable—enter label grams manually.";}
}

function pickHit(i){
const hit=netHits[i][+document.getElementById("res"+i).value];
if(!hit)return;
document.getElementById("n"+i).value=hit.product_name;
document.getElementById("p"+i).value=Math.round((hit.nutriments.proteins_100g/100)*32);
renderTable();
}

function renderTable(){
const list=[];
for(let i=1;i<=3;i++){
const v=document.getElementById("s"+i).value;
if(v==="none")continue;
if(v==="custom"){
const m=+document.getElementById("m"+i).value||0,sc=+document.getElementById("sc"+i).value||0,p=+document.getElementById("p"+i).value||0;
if(m>0&&sc>0&&p>0){const nm=document.getElementById("n"+i).value.trim()||"Custom "+i;list.push({n:nm,t:"Internet / Custom Lookup",m,s:sc,p,tot:sc*p,cpg:m/(sc*p),h:"Live Web Lookup",u:"https://www.amazon.in/s?k="+encodeURIComponent(nm)+"&tag="+TAG});}
}else if(DB[v]){const x=DB[v];list.push({...x,tot:x.s*x.p,cpg:x.m/(x.s*x.p)});}
}
if(list.length<2)return;
const min=Math.min(...list.map(x=>x.cpg));
let r1="<tr><th>Product</th>",r2="<tr><th>Type</th>",r3="<tr><th>Amazon MRP</th>",r4="<tr><th>Protein / Scoop</th>",r5="<tr><th>Total Protein</th>",r6="<tr><th>Cost / Gram (MRP)</th>",r7="<tr><th>Highlight</th>",r8="<tr><th>Buy</th>";
list.forEach(x=>{
const w=Math.abs(x.cpg-min)<0.01;
r1+=`<td>${w?'<span class="win">BEST VALUE</span><br>':''}<strong>${x.n}</strong></td>`;
r2+=`<td>${x.t}</td>`;
r3+=`<td>₹${x.m.toLocaleString('en-IN')}</td>`;
r4+=`<td><strong>${x.p}g</strong> (${x.s} scoops)</td>`;
r5+=`<td>${x.tot}g</td>`;
r6+=`<td style="color:${w?'#34d399':'#fff'};font-weight:700">₹${x.cpg.toFixed(2)} / g</td>`;
r7+=`<td style="color:#94a3b8;font-size:.82rem">${x.h}</td>`;
r8+=`<td><a href="${x.u}" target="_blank" rel="nofollow sponsored" class="buy">Check Amazon &rarr;</a></td>`;
});
document.getElementById("tbl").innerHTML=r1+"</tr>"+r2+"</tr>"+r3+"</tr>"+r4+"</tr>"+r5+"</tr>"+r6+"</tr>"+r7+"</tr>"+r8+"</tr>";
}
init();
</script>
