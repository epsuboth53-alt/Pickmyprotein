<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare All Protein Powders in India | Pick My Protein</title>
<style>
:root{--p:#f36c21;--bg:#0f172a;--card:#1e293b;--b:#334155}
body{font-family:system-ui,sans-serif;background:var(--bg);color:#fff;margin:0;line-height:1.5}
header{padding:1rem 2rem;display:flex;justify-content:space-between;border-bottom:1px solid var(--b)}
nav a{color:#cbd5e1;text-decoration:none;margin-left:1.5rem}
.wrap{max-width:1020px;margin:2rem auto;padding:0 1rem}
.box{background:var(--card);padding:1.5rem;border-radius:12px;border:1px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.slot{background:var(--bg);padding:1rem;border-radius:8px;border:1px solid var(--b)}
label{display:block;font-size:.8rem;color:#cbd5e1;margin:.5rem 0 .2rem}
select,input{width:100%;padding:.58rem;border-radius:6px;border:1px solid var(--b);background:var(--card);color:#fff;box-sizing:border-box;font-size:.88rem}
.cbox{display:none;margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--b)}
.row{display:flex;gap:.4rem;margin-top:.4rem}
.sbtn{background:#334155;color:#fff;border:1px solid #475569;padding:.45rem;border-radius:5px;font-size:.78rem;cursor:pointer;flex:1;font-weight:600}
.sbtn:hover{border-color:var(--p);color:var(--p)}
.btn{background:var(--p);color:#fff;border:none;padding:.9rem;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:1.2rem;width:100%}
.twrap{overflow-x:auto;margin-top:1.5rem}
table{width:100%;border-collapse:collapse;background:var(--bg)}
th,td{padding:.8rem;border:1px solid var(--b);text-align:left;font-size:.9rem}
th{background:#0b1120;color:#cbd5e1;width:22%}
.win{background:rgba(52,211,153,.15);color:#34d399;padding:.15rem .45rem;border-radius:4px;font-size:.72rem;font-weight:700}
.buy{display:inline-block;background:var(--p);color:#fff;padding:.4rem .8rem;border-radius:5px;text-decoration:none;font-size:.82rem;font-weight:600}
</style>
</head>
<body>
<header>
<a href="/" style="color:#fff;font-weight:700;text-decoration:none">pickmyprotein.com</a>
<nav><a href="/calculators/">Calculators</a><a href="/compare/" style="color:#f36c21">Compare</a><a href="/best-protein/">Best Guides</a></nav>
</header>

<div class="wrap">
<h1>Compare Any Protein Powder in India</h1>
<p style="color:#94a3b8;margin-top:-.4rem">Verified label specs & current Amazon India selling prices—or choose <strong>"🌐 Search Any Brand Online"</strong>.</p>
<div class="box">
<div class="grid" id="slots"></div>
<button type="button" class="btn" onclick="renderTable()">⚡ Compare Selected Proteins Side-by-Side</button>
<div class="twrap"><table id="tbl"></table></div>
</div>
</div>

<script>
const TAG="pickmyprote03-21";
const amz=(q)=>"https://www.amazon.in/s?k="+encodeURIComponent(q)+"&tag="+TAG;
const DB={
mb_enz:{n:"MuscleBlaze Raw Whey Protein Concentrate, Unflavoured, 1kg",t:"Whey Concentrate",m:2899,s:33,p:24,h:"Light & Clean • Easy-to-Digest",u:"https://www.amazon.in/dp/B0BPH457FG?tag="+TAG},
mb_raw:{n:"MuscleBlaze 100% Clean Raw Whey Protein Concentrate, 1kg",t:"Raw Whey Concentrate",m:3499,s:33,p:24,h:"Lab-Tested Purity",u:"https://www.amazon.in/dp/B06XGNT22C?tag="+TAG},
mb_bio2kg:{n:"MuscleBlaze Biozyme Performance Whey Protein Powder, 2kg",t:"Enhanced Absorption Whey",m:8199,s:56,p:25,h:"50% Higher Absorption • 2kg Pack",u:"https://www.amazon.in/dp/B095SV6BBZ?tag="+TAG},
mb_pr:{n:"MuscleBlaze Biozyme Whey PR Protein Powder, 1kg",t:"Whey + 3g Creatine",m:3949,s:25,p:30,h:"30g Protein + 3g Creatine",u:"https://www.amazon.in/dp/B0D6R1GKH3?tag="+TAG},
mb_beg:{n:"MuscleBlaze Beginner's Whey Protein Powder, Chocolate, 1kg",t:"Beginner Whey Blend",m:1849,s:33,p:12,h:"Starter Formula",u:amz("MuscleBlaze Beginners Whey Protein 1kg")},
fuel_max:{n:"FUELONE Whey Max Protein Blend, Cold Coffee, 1kg",t:"Whey Concentrate",m:2799,s:28,p:27,h:"Cold Coffee Flavour • Trustified",u:amz("Fuel One Whey Max 1kg")},
as_raw:{n:"AS-IT-IS Nutrition Whey Protein Concentrate 80% - 1kg",t:"Raw Whey Concentrate",m:3298,s:29,p:28,h:"Labdoor Certified • 28g/serve",u:"https://www.amazon.in/dp/B079SZJJDR?tag="+TAG},
as_atom:{n:"AS-IT-IS ATOM Whey Protein Powder 1kg",t:"Flavoured Concentrate",m:3134,s:28,p:27,h:"27g Protein per Serving",u:"https://www.amazon.in/dp/B09DKFPQ91?tag="+TAG},
as_pwr:{n:"AS-IT-IS ATOM PWR Whey Protein XL Powder 1kg",t:"Beginner Whey",m:1792,s:33,p:24,h:"24g Protein per Serving",u:amz("AS-IT-IS ATOM PWR Whey Protein XL 1kg")},
nk_gold:{n:"NAKPRO NUTRITION Gold Clean Raw Whey Protein Concentrate | 1kg",t:"Whey Concentrate",m:2999,s:26,p:28,h:"Trustified Certified • 28g/serve",u:"https://www.amazon.in/dp/B07M7YZ57R?tag="+TAG},
nk_perf:{n:"NAKPRO NUTRITION Perform Whey Protein Concentrate | 1kg",t:"Budget Whey Concentrate",m:2199,s:30,p:26,h:"Trustified • 26g Protein",u:"https://www.amazon.in/dp/B07YX4VLC2?tag="+TAG},
nk_imp:{n:"NAKPRO NUTRITION Impact Whey Protein Isolate & Concentrate | 1kg",t:"Isolate + Concentrate",m:1599,s:30,p:24,h:"Malai Kulfi • Digestive Enzymes",u:amz("Nakpro Impact Whey Protein 1kg")},
nk_iso:{n:"NAKPRO Platinum Plus+ Whey Protein Isolate | 1kg",t:"100% Whey Isolate",m:3499,s:30,p:28,h:"28g Protein • 6.36g BCAA",u:"https://www.amazon.in/dp/B0C23R85XQ?tag="+TAG},
nk_hyd:{n:"Nakpro Hydro Whey Hydrolyzed (1kg)",t:"Hydrolyzed Whey",m:3899,s:30,p:28,h:"Fast-Absorbing Hydrolyzed Isolate",u:amz("Nakpro Hydro Whey Protein 1kg")},
avvatar:{n:"avvatar WHEY PROTEIN | 1Kg | Malai Kulfi Flavour",t:"Fresh Cow Milk Whey",m:4229,s:29,p:28,h:"28g Protein • 29 Servings",u:"https://www.amazon.in/dp/B09CKM57HL?tag="+TAG},
avv_iso:{n:"avvatar ISORICH WHEY PROTEIN | 1Kg | Malai Kulfi Flavour",t:"100% Whey Isolate",m:5469,s:29,p:29,h:"29g Pure Isolate • 29 Servings",u:amz("Avvatar Isorich Whey Protein Isolate 1kg")},
twt:{n:"The Whole Truth Whey Protein Concentrate | Unflavoured | 1kg",t:"Clean Whey Concentrate",m:3899,s:33,p:26,h:"26g Protein • 6.4g BCAA",u:amz("The Whole Truth Unflavoured Whey Protein Concentrate 1kg")},
wb:{n:"Wellbeing Nutrition Clean Whey Protein Concentrate 1kg Unflavoured",t:"Whey + 4B Probiotics",m:3999,s:28,p:27,h:"4B CFU Probiotics • Digestive Enzymes",u:"https://www.amazon.in/dp/B0DMNWWH5S?tag="+TAG},
yb:{n:"Yogabar ProClean Whey Protein Concentrate 1kg",t:"Whey Concentrate",m:2670,s:28,p:27,h:"27g Protein • Pro-Absorb Blend",u:"https://www.amazon.in/dp/B0DV5D8355?tag="+TAG},
nb_gold:{n:"Nutrabay Gold Whey Protein Concentrate with Enzymes | 1kg",t:"Whey Concentrate",m:2999,s:28,p:25,h:"Rich Chocolate • Trustified",u:amz("Nutrabay Gold 100% Whey Protein Concentrate 1kg")}
};
let netHits={1:[],2:[],3:[]};

function init(){
const defs=["mb_enz","as_raw","none"];
let out="";
for(let i=1;i<=3;i++){
let opts=i===3?'<option value="none" selected>-- None (Compare 2) --</option>':'';
opts+='<option value="custom">🌐 Search Any Brand Online (Internet Lookup)</option>';
for(const k in DB) opts+=`<option value="${k}" ${defs[i-1]===k?'selected':''}>${DB[k].n}</option>`;
out+=`<div class="slot"><strong style="color:${i<3?'#f36c21':'#94a3b8'}">Product ${i}${i===3?' (Optional)':''}</strong>
<label>Select from Brand List or Search Web</label><select id="s${i}" onchange="onSel(${i})">${opts}</select>
<div id="c${i}" class="cbox">
<label>Type Any Brand / Product Name</label><input id="n${i}" placeholder="e.g., BeastLife Whey, MyProtein, GNC">
<div class="row"><button type="button" class="sbtn" onclick="fetchNet(${i})">🌐 Search Internet</button><button type="button" class="sbtn" onclick="window.open(amz(document.getElementById('n${i}').value||'whey protein 1kg'))">🛒 Check Amazon</button></div>
<div id="st${i}" style="font-size:.75rem;color:#34d399;margin-top:.3rem"></div>
<select id="res${i}" style="display:none;margin-top:.35rem" onchange="pickHit(${i})"></select>
<label>Amazon Price (₹)</label><input type="number" id="m${i}" value="2999" oninput="renderTable()">
<label>Total Scoops in Pack</label><input type="number" id="sc${i}" value="30" oninput="renderTable()">
<label>Protein Per Scoop (g)</label><input type="number" id="p${i}" value="24" oninput="renderTable()">
</div></div>`;
}
document.getElementById("slots").innerHTML=out;
renderTable();
}

function onSel(i){
document.getElementById("c"+i).style.display=document.getElementById("s"+i).value==="custom"?"block":"none";
renderTable();
}

async function fetchNet(i){
const q=document.getElementById("n"+i).value.trim();
const st=document.getElementById("st"+i),sel=document.getElementById("res"+i);
if(!q)return alert("Type a brand or product name first");
st.style.color="#94a3b8";st.textContent="Searching global & India food database...";sel.style.display="none";
try{
const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=8");
const d=await r.json();
netHits[i]=(d.products||[]).filter(x=>x.product_name&&x.nutriments&&x.nutriments.proteins_100g);
if(netHits[i].length){
sel.innerHTML=netHits[i].map((x,idx)=>`<option value="${idx}">${x.product_name} (${Math.round(x.nutriments.proteins_100g)}g/100g)</option>`).join("");
sel.style.display="block";pickHit(i);
st.style.color="#34d399";st.textContent="✓ Found "+netHits[i].length+" matches—select version above & enter Amazon Price:";
return;
}
st.style.color="#f36c21";st.textContent="Not in open database—click Check Amazon & enter label grams below.";
}catch(e){st.style.color="#f36c21";st.textContent="Search unavailable—enter label grams manually.";}
}

function pickHit(i){
const hit=netHits[i][+document.getElementById("res"+i).value];
if(!hit)return;
document.getElementById("n"+i).value=hit.product_name;
document.getElementById("p"+i).value=Math.round((hit.nutriments.proteins_100g/100)*32);
renderTable();
}

function renderTable(){
const list=[];
for(let i=1;i<=3;i++){
const v=document.getElementById("s"+i).value;
if(v==="none")continue;
if(v==="custom"){
const m=+document.getElementById("m"+i).value||0,sc=+document.getElementById("sc"+i).value||0,p=+document.getElementById("p"+i).value||0;
if(m>0&&sc>0&&p>0){const nm=document.getElementById("n"+i).value.trim()||"Custom "+i;list.push({n:nm,t:"Internet / Custom Lookup",m,s:sc,p,tot:sc*p,cpg:m/(sc*p),h:"Live Web Lookup",u:amz(nm)});}
}else if(DB[v]){const x=DB[v];list.push({...x,tot:x.s*x.p,cpg:x.m/(x.s*x.p)});}
}
if(list.length<2)return;
const min=Math.min(...list.map(x=>x.cpg));
let r1="<tr><th>Product</th>",r2="<tr><th>Type</th>",r3="<tr><th>Est. Amazon Price</th>",r4="<tr><th>Protein / Scoop</th>",r5="<tr><th>Total Protein</th>",r6="<tr><th>Cost / Gram</th>",r7="<tr><th>Highlight</th>",r8="<tr><th>Buy</th>";
list.forEach(x=>{
const w=Math.abs(x.cpg-min)<0.01;
r1+=`<td>${w?'<span class="win">BEST VALUE</span><br>':''}<strong>${x.n}</strong></td>`;
r2+=`<td>${x.t}</td>`;
r3+=`<td>₹${x.m.toLocaleString('en-IN')}</td>`;
r4+=`<td><strong>${x.p}g</strong> (${x.s} scoops)</td>`;
r5+=`<td>${x.tot}g</td>`;
r6+=`<td style="color:${w?'#34d399':'#fff'};font-weight:700">₹${x.cpg.toFixed(2)} / g</td>`;
r7+=`<td style="color:#94a3b8;font-size:.82rem">${x.h}</td>`;
r8+=`<td><a href="${x.u}" target="_blank" rel="nofollow sponsored" class="buy">Check Amazon &rarr;</a></td>`;
});
document.getElementById("tbl").innerHTML=r1+"</tr>"+r2+"</tr>"+r3+"</tr>"+r4+"</tr>"+r5+"</tr>"+r6+"</tr>"+r7+"</tr>"+r8+"</tr>";
}
init();
</script>
</body>
</html>
