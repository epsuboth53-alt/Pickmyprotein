    <style>
        :root { --primary: #f36c21; --bg-dark: #0f172a; --card-bg: #1e293b; --border: #334155; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: #fff; margin: 0; line-height: 1.6; }
        header { padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 1.5rem; }
        .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .builder-box { background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2.5rem; }
        .select-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.25rem; margin-top: 1rem; }
        .slot-card { background: var(--bg-dark); padding: 1.25rem; border-radius: 10px; border: 1px solid var(--border); }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin: 0.6rem 0 0.25rem; }
        select, input { width: 100%; padding: 0.65rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: #fff; font-size: 0.95rem; box-sizing: border-box; }
        .custom-fields { display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); }
        button { background: var(--primary); color: #fff; border: none; padding: 0.85rem 1.5rem; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 1.5rem; width: 100%; }
        button:hover { opacity: 0.92; }
        .table-wrap { overflow-x: auto; margin-top: 1.5rem; display: none; }
        table { width: 100%; border-collapse: collapse; background: var(--bg-dark); border-radius: 8px; overflow: hidden; }
        th, td { padding: 0.9rem; border: 1px solid var(--border); text-align: left; font-size: 0.95rem; }
        th { background: #0b1120; color: #cbd5e1; width: 25%; }
        .winner-badge { background: rgba(52, 211, 153, 0.15); color: #34d399; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-bottom: 0.3rem; }
        .btn-buy { display: inline-block; background: var(--primary); color: #fff; padding: 0.45rem 0.85rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; margin-top: 1.25rem; }
        .card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); text-decoration: none; color: #fff; display: block; }
        .card:hover { border-color: var(--primary); }
        .tag { background: rgba(243, 108, 33, 0.15); color: var(--primary); padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    </style>
